name: Apply dialog focus repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dialog-focus.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch dialog-owned focus restoration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/listing/VehicleSearchDialog.svelte')
          text = path.read_text(encoding='utf-8')
          old = """  const restorePage = () => {
            filtersOpen = false;
            releaseOffset?.();
            if (returnFocus?.isConnected) returnFocus.focus();
          };"""
          new = """  const restorePage = () => {
            filtersOpen = false;
            releaseOffset?.();
            const target = returnFocus;
            let attempts = 0;
            const restoreFocus = () => {
              if (target?.isConnected) {
                target.focus({ preventScroll: true });
                if (target.matches(':focus')) return;
              }
              if (attempts++ < 60) requestAnimationFrame(restoreFocus);
            };
            setTimeout(() => requestAnimationFrame(restoreFocus), 0);
          };"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one restorePage block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-dialog-focus.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/components/listing/VehicleSearchDialog.svelte .github/workflows/fix-dialog-focus.yml
          git commit -m 'Restore focus after the filter dialog closes'
          git push origin HEAD:main
