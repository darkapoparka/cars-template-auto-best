name: Hide empty dealer video sections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hide-empty-video-section.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Make dealer video presence data-driven
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          brand = Path('src/lib/config/brand.ts')
          text = brand.read_text(encoding='utf-8')
          old = '  youtubeUrl: `https://${string}`;'
          new = "  youtubeUrl: `https://${string}` | '';"
          if text.count(old) != 1:
              raise SystemExit(f'expected one youtubeUrl type, found {text.count(old)}')
          brand.write_text(text.replace(old, new), encoding='utf-8')

          component = Path('src/lib/components/home/VideoSection.svelte')
          text = component.read_text(encoding='utf-8')
          opening = '<section class="dn-videos" aria-labelledby="videos-title">'
          closing = '</section>\n\n<style>'
          if text.count(opening) != 1 or text.count(closing) != 1:
              raise SystemExit('could not locate the video section boundary')
          text = text.replace(opening, '{#if brand.youtubeUrl && featuredVideos.length > 0}\n' + opening)
          text = text.replace(closing, '</section>\n{/if}\n\n<style>')
          component.write_text(text, encoding='utf-8')
          PY
          grep -q "youtubeUrl:.*| ''" src/lib/config/brand.ts
          grep -q '{#if brand.youtubeUrl && featuredVideos.length > 0}' src/lib/components/home/VideoSection.svelte
          git diff --check
      - name: Validate template
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run validate
      - name: Commit reviewed template fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hide-empty-video-section.yml
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main moved during validation; refusing to overwrite' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/config/brand.ts src/lib/components/home/VideoSection.svelte .github/workflows/hide-empty-video-section.yml
          git commit -m 'Hide video section without verified dealer media'
          git push origin HEAD:main
